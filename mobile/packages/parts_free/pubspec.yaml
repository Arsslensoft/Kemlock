# The free build's parts (openspec: add-fdroid-release, design decisions 1,
# 3, 4 and 5): only free software. tool/build/use_free.sh points the app's
# kemlock_parts here in place of packages/parts_store.
name: kemlock_parts
description: "Kemlock's free build parts: a QR scanner of free software, no text recognition and no store."
publish_to: "none"
version: 1.0.0

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  kemlock_ports:
    path: ../kemlock_ports
  # Flutter's own camera plugin (BSD; CameraX on Android, Apache-2.0).
  camera: ^0.12.2
  # Android's UnifiedPush push: free software (the connector is Apache-2.0), with no Google service.
  unified_push:
    path: ../unified_push
  # ZXing in Dart (BSD-3-Clause). Exact: qr_decoder.dart uses its implementation libraries.
  zxing2: 0.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
