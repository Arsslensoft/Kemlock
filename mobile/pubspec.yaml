name: kemlock
description: "A post-quantum encrypted authenticator: one-time codes and backup codes, kept on the phone."
publish_to: "none"

# The build number is above the last Capacitor build (versionCode 1, build 1),
# so this ships as an update to the same store listings.
version: 1.1.0+2

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  shared_preferences: ^2.5.6
  shared_preferences_android: ^2.4.28
  shared_preferences_foundation: ^2.5.7
  path_provider: ^2.1.6
  path: ^1.9.1
  crypto: ^3.0.7
  cryptography: ^2.9.0
  http: ^1.6.0
  # The interfaces of the parts the free build replaces (openspec: add-fdroid-release).
  kemlock_ports:
    path: packages/kemlock_ports
  # The store build's parts: mobile_scanner, ML Kit's text recognition and pdfrx.
  # tool/build/use_free.sh points this at packages/parts_free for the free build.
  kemlock_parts:
    path: packages/parts_store
  qr_flutter: ^4.1.0
  local_auth: ^3.0.2
  share_plus: ^13.3.1
  file_picker: ^13.1.0
  image_picker: ^1.2.4
  pdf: ^3.13.1
  printing: ^5.15.1
  url_launcher: ^6.3.3
  flutter_svg: ^2.3.0
  intl: ^0.20.3
  uuid: ^4.6.0
  package_info_plus: ^10.2.2
  collection: ^1.19.1
  pointycastle: ^4.0.0
  archive: ^4.5.2
  xml: ^7.0.1
  flutter_local_notifications: ^23.0.2
  timezone: ^0.11.2
  unorm_dart: ^0.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  fake_async: ^1.3.3
  test: ^1.31.1

flutter:
  uses-material-design: true

  assets:
    - assets/brand/kemlock-icon.svg
    - assets/brand/kemlock-icon-small.svg
    - assets/brand/kemlock-wordmark-dark.svg
    - assets/brand/kemlock-wordmark-light.svg
    - assets/data/
    - assets/i18n/

  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/GeistMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/GeistMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/GeistMono-Bold.ttf
          weight: 700
