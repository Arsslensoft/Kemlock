include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    unawaited_futures: warning
  exclude:
    - build/**
    - android/**
    - ios/**
    # Each build's parts resolve only in that build: analyze them with it, as
    # flutter analyze packages/parts_store, or packages/parts_free after
    # tool/build/use_free.sh (openspec: add-fdroid-release).
    - packages/parts_store/**
    - packages/parts_free/**

formatter:
  page_width: 140

linter:
  rules:
    always_declare_return_types: true
    avoid_print: true
    avoid_dynamic_calls: true
    cancel_subscriptions: true
    directives_ordering: true
    prefer_final_locals: true
    prefer_single_quotes: true
    sort_child_properties_last: true
    unawaited_futures: true
    use_super_parameters: true
