# The libraries the app ships in a fixed version: only the older build tool versions the advisory reaches.[[PackageOverrides]]
name = "com.google.android.gms:play-services-basement"
version = "17.0.0"
ecosystem = "Maven"
vulnerability.ignore = true
reason = "com.google.android.gms:play-services-basement:17.0.0 is a version a plugin requests, of which Gradle reads only the POM; every build resolves it up to 18.9.0, past GHSA-cm6r-892j-jv2g's fix (18.0.2), so the APK has the fixed library."

