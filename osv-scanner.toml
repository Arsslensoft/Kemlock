# What OSV-Scanner (and so the OpenSSF Scorecard's Vulnerabilities check) skips, and why.
#
# It reads mobile/android/gradle/verification-metadata.xml, which lists every artifact Gradle resolved,
# the build's own tools included, and it reports an advisory for each of them. The ones below are in
# the build tools' dependencies (the Android Gradle plugin, Android lint, bundletool, the Kotlin Gradle
# plugin) or in debug-only test libraries, and none of them is on the release runtime classpath of the
# store build or the free build: check it with
#
#   ./gradlew :app:dependencies --configuration releaseRuntimeClasspath
#
# What does ship in the APK and had an advisory is fixed, not listed: Guava is held at 33.7.2-android by
# an eachDependency rule in mobile/android/build.gradle.kts. Add nothing here for a library the app ships.
#
# Four advisories also name libraries the app does ship, in versions the advisory doesn't reach (Guava
# 33.7.2, gson 2.12.0, kotlin-stdlib 2.4.21, play-services-basement 18.9.0). They are not ignored by id,
# which would hide them for those too; only the older build-tool versions that the advisory does reach are
# skipped, in the [[PackageOverrides]] at the end.
#
# The same file is in mobile/android/gradle/, next to the metadata, because OSV-Scanner reads the
# configuration of the directory it scans.

