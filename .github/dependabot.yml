# Dependabot: version updates weekly, minor and patch together in one pull request per ecosystem and
# a major version on its own. Security updates are turned on in the repository's settings
# (tool/github/apply_settings.sh) and follow these settings for labels and commit messages, but
# are never held back by the schedule or grouped with the rest.
#
# A pub update changes two lockfiles and a Gradle update changes a checksum file, and Dependabot
# writes only the first of each: .github/workflows/dependabot-lockfiles.yml regenerates
# pubspec.free.lock and android/gradle/verification-metadata.xml on these pull requests. Commit
# messages are Conventional Commits (CLAUDE.md), so the commit lint passes on them.
#
# The crypto packages (cryptography, crypto, pointycastle) are updated like the others, and a
# release that changes what they output fails the fixture tests, which is the point of those tests.
# There is no `bundler` entry: fastlane/ holds only store metadata and has no Gemfile. The release
# container (mobile/tool/release/Containerfile) pins its tools by checksum so that releases stay
# reproducible, and is updated by hand.
version: 2

updates:
  - package-ecosystem: pub
    # The app, and each package under mobile/packages (path dependencies of the app, each with a
    # pubspec.yaml). Only mobile/ has lockfiles.
    directories:
      - /mobile
      - /mobile/packages/*
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - dart
    commit-message:
      prefix: "chore(deps)"
    groups:
      pub-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: gradle
    # The app, and the credential transfer plugin's own build file.
    directories:
      - /mobile/android
      - /mobile/packages/credential_transfer/android
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - android
    commit-message:
      prefix: "chore(deps)"
    groups:
      gradle-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    # The workflows, and the composite actions under .github/actions.
    directories:
      - /
      - /.github/actions/setup-flutter
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
