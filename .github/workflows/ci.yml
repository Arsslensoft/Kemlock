name: CI

# Checks the Flutter app in mobile/ on every pull request, on every push to main, in the
# merge queue, and when started by hand from the Actions tab: formatting, analysis and the
# tests of the store build and of the free build (F-Droid), the Kotlin tests on the JVM with
# Gradle's dependency verification on, both APKs and the Swift tests on a simulator. The
# pure-Dart code and its dart2wasm run are Kemlock-core's, checked in that repository.
#
# Every Dart check runs on both builds (openspec: add-fdroid-release): the store build as
# checked out, then the free build, after tool/build/use_free.sh swaps in its parts and its
# lockfile. `flutter pub get --enforce-lockfile` runs on each, so a pubspec change that
# leaves either pubspec.lock or pubspec.free.lock behind fails here.
#
# The jobs are skipped, not removed, on a pull request that touches nothing they read, so
# this workflow can be required without a path filter. Require only "CI gate": it is green
# when every job it waits for passed or was skipped, so a skipped matrix job can't leave a
# required check pending. The iOS job reports to the gate but doesn't fail it until the
# repository variable CI_REQUIRE_IOS is set to "true".
#
# A newer run for the same pull request or branch cancels the one still going, a push to main
# included: after back-to-back merges only the newest main run goes on, and uploads the coverage.
# A run started by hand has a group of its own, so a push never cancels it.

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Everything but a pull request runs every job. A pull request runs them when it touches the
      # app, this workflow, its actions or the scripts it runs.
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          mobile=true
          if [ "$EVENT" = pull_request ]; then
            if files="$(git diff --name-only "$BASE...$HEAD")"; then
              if grep -Eq '^(mobile/|\.github/workflows/ci\.yml$|\.github/actions/|tool/ci/)' <<<"$files"; then
                mobile=true
              else
                mobile=false
              fi
            fi
          fi
          echo "mobile=$mobile" >> "$GITHUB_OUTPUT"
          echo "Jobs that read mobile/ run: $mobile"

  format:
    name: Format
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-flutter

      # The page width, 140, is in analysis_options.yaml's formatter section: never pass -l.
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test packages tool/build tool/release

  check:
    name: Analyze and test (${{ matrix.build }})
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: store
            coverage: --coverage
          - build: free
            coverage: ""
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-flutter
        with:
          build: ${{ matrix.build }}

      # Each build's parts resolve only in that build (analysis_options.yaml excludes them from
      # the app's own analysis), so each is analyzed and tested with its build.
      - name: Analyze
        run: flutter analyze && flutter analyze packages/parts_${{ matrix.build }}

      - name: Test
        run: flutter test ${{ matrix.coverage }} && flutter test packages/parts_${{ matrix.build }}/test

      - name: Upload the coverage
        if: matrix.build == 'store'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: mobile/coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

      # Codecov is optional: with no CODECOV_TOKEN secret (a fork's pull request has none) the upload
      # is skipped and the check stays green. The token is read by these two steps only, never by the
      # steps that run the app's tests and dependencies' code.
      - name: Is there a Codecov token
        id: codecov
        if: matrix.build == 'store'
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -n "$CODECOV_TOKEN" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; fi

      - name: Upload the coverage to Codecov
        if: steps.codecov.outputs.enabled == 'true'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: mobile/coverage/lcov.info
          fail_ci_if_error: false

  android-unit:
    name: Android unit tests
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-flutter

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-unit-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/gradle/wrapper/gradle-wrapper.properties', 'mobile/android/gradle/verification-metadata.xml', 'mobile/pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-unit-

      # The autofill service's codes, matching and field finding, and the credential transfer
      # plugin's export checks, on the JVM, and lint. The checksums in
      # android/gradle/verification-metadata.xml are checked strictly: a dependency that isn't
      # in it, or has another checksum, fails the build. The runner's own JDK 17 is for the
      # Android Gradle plugin.
      - name: Kotlin tests and lint
        working-directory: mobile/android
        run: |
          # gradlew and its wrapper jar are made by Flutter, not kept in git: --config-only writes them, and builds nothing
          (cd .. && flutter build apk --config-only --debug)
          JAVA_HOME="$JAVA_HOME_17_X64" ./gradlew --dependency-verification strict \
            :app:testDebugUnitTest :app:lintDebug :credential_transfer:testDebugUnitTest

      - name: Upload the test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-unit-reports
          path: |
            mobile/android/app/build/reports
            mobile/packages/credential_transfer/android/build/reports
          if-no-files-found: ignore
          retention-days: 7

  android-build:
    name: Android build (${{ matrix.build }})
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        build: [store, free]
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-flutter
        with:
          build: ${{ matrix.build }}

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ matrix.build }}-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/gradle/wrapper/gradle-wrapper.properties', 'mobile/android/gradle/verification-metadata.xml', 'mobile/pubspec.lock', 'mobile/pubspec.free.lock') }}
          restore-keys: gradle-${{ runner.os }}-${{ matrix.build }}-

      # Both compile, each with its own plugins (openspec: add-fdroid-release). Gradle checks
      # every dependency against android/gradle/verification-metadata.xml.
      - name: Build the ${{ matrix.build }} build
        run: JAVA_HOME="$JAVA_HOME_17_X64" flutter build apk --debug

      # No class of ML Kit, Play services or a store, and no stray native library, in it.
      - name: Check the free build is free
        if: matrix.build == 'free'
        run: dart run tool/release/check_free.dart build/app/outputs/flutter-apk/app-debug.apk

  ios:
    name: iOS tests
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: macos-26
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-flutter

      # The AutoFill extension answers iOS 26.2's requests to generate and save passwords
      # (openspec: add-passwords), which build only against the iOS 26.2 SDK or later. The image's
      # default Xcode has one: Xcode 26.2 and 26.3 ship the 26.2 SDK, later ones a newer SDK. This
      # stops the job, rather than the build, when an image comes with an older one.
      - name: Xcode with the iOS 26.2 SDK
        run: |
          sdk=$(xcrun --sdk iphonesimulator --show-sdk-version)
          echo "$(xcodebuild -version | head -n 1), iOS SDK $sdk"
          python3 -c 'import sys; sys.exit(tuple(map(int, sys.argv[1].split("."))) < (26, 2))' "$sdk" ||
            { echo "::error::The AutoFill extension needs the iOS 26.2 SDK or later, and this Xcode has $sdk"; exit 1; }

      # Builds the pods and the AutoFill extension for the simulator, unsigned. Xcode doesn't build
      # the Pods-Runner framework Runner links on its own here, so its scheme is built first.
      - name: Build
        run: |
          flutter build ios --simulator --debug --no-codesign --config-only
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Pods-Runner -configuration Debug \
            -sdk iphonesimulator SYMROOT="$PWD/build/ios" -quiet build
          flutter build ios --simulator --debug --no-codesign

      # The AutoFill extension's codes, matching and copy, in RunnerTests. ML Kit ships no arm64
      # simulator slice, so the tests run on an x86_64 simulator.
      - name: Swift tests
        working-directory: mobile/ios
        run: |
          iphone=$(xcrun simctl list devices available -j | python3 -c 'import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, ds in devices.items() if "iOS" in runtime for d in ds if d["name"].startswith("iPhone")))')
          xcodebuild test -workspace Runner.xcworkspace -scheme Runner -only-testing:RunnerTests \
            -destination "id=$iphone,arch=x86_64" EXCLUDED_ARCHS=arm64 CODE_SIGNING_ALLOWED=NO \
            SYMROOT="$PWD/../build/ios"

  gate:
    name: CI gate
    if: always()
    needs: [changes, format, check, android-unit, android-build, ios]
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - name: Every job passed, or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
          REQUIRE_IOS: ${{ vars.CI_REQUIRE_IOS }}
        run: |
          failed=0
          while read -r job result; do
            echo "$job: $result"
            case "$result" in
              success | skipped) ;;
              *)
                if [ "$job" = ios ] && [ "$REQUIRE_IOS" != true ]; then
                  echo "::warning::$job is $result; it is not required until CI_REQUIRE_IOS is true"
                else
                  failed=1
                fi
                ;;
            esac
          done < <(jq -r 'to_entries[] | "\(.key) \(.value.result)"' <<<"$NEEDS")
          exit "$failed"
