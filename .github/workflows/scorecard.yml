name: Scorecard

# OpenSSF Scorecard: scores the repository's supply-chain practices (pinned actions, branch
# protection, signed releases, dependency updates, a security policy) and publishes the result to
# https://scorecard.dev, which the README's badge reads. It publishes only for a public
# repository, so it is skipped while this one is private. Results also go to the code scanning
# page, where a pinned-dependencies finding names each action still to pin to a SHA.

on:
  branch_protection_rule:
  schedule:
    - cron: "41 3 * * 2"
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to main cancels the run still going; scheduled and manual runs have their own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      security-events: write # uploads the SARIF results to code scanning
      id-token: write # publishes the result to scorecard.dev
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
