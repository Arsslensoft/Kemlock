name: Dependency review

# Looks at what a pull request adds to the dependency graph (pubspec.lock, the Gradle files, the
# workflows' actions) and fails it for a dependency with a known vulnerability of high severity or
# above, or with a licence that isn't one a GPL-3.0-or-later program may use.
#
# What it sees: the Dart packages of pubspec.lock, and the Gradle dependencies where the dependency
# graph reads them. For the Android side this is the only licence check: no Gradle licence plugin
# is added to the build. The Dart packages' licences are also read from their own files by
# tool/ci/check_licenses.mjs (licences.yml), for both lockfiles, because the dependency graph
# doesn't read pubspec.free.lock.
#
# In the merge queue (merge_group) the job is skipped, which a required check counts as passing: the
# review is of the pull request's own diff, and was done on it.
#
# It needs the dependency graph, which public repositories have. A private repository needs GitHub
# Advanced Security; set the repository variable GHAS_ENABLED to "true" when it has it.

on:
  pull_request:
    branches: [main]
  merge_group:

permissions: {}

jobs:
  review:
    name: Dependency review
    if: ${{ github.event_name != 'merge_group' && (!github.event.repository.private || vars.GHAS_ENABLED == 'true') }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write # the summary comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          # The pub licences come through in lower case ("mit"), which this action doesn't take as SPDX, so
          # every pub dependency failed. The Licences workflow (tool/ci/check_licenses.mjs) checks the pub
          # licences; this one checks vulnerabilities.
          license-check: false
          comment-summary-in-pr: on-failure
