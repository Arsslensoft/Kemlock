name: Secret scan

# gitleaks over the commits of a pull request, and of a push to main. The rules are
# .gitleaks.toml: gitleaks' own, with the test keys under mobile/test/fixtures (made for the
# tests, and never regenerated) set aside. GitHub's secret scanning and push protection, which
# tool/github/apply_settings.sh turns on, work alongside this.
#
# It runs the gitleaks CLI (MIT, checked against its release checksum), not gitleaks-action, which
# needs a paid licence on an organization's repository.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:

concurrency:
  # A newer run for the same pull request, or a newer push to main, cancels the one still going.
  # Scheduled and manual runs have a group of their own, so a push never cancels them.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

permissions: {}

jobs:
  gitleaks:
    name: Secret scan
    # In the merge queue (merge_group) the job is skipped, which a required check counts as passing: the
    # commits were scanned on the pull request.
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read # the commits of a pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The gitleaks CLI, checked against its release checksum. The gitleaks action wants a paid licence
      # on an organisation's repository; the CLI is MIT and needs none.
      - name: Install gitleaks 8.30.1
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz

      - name: Scan the new commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            range="$BASE..HEAD"
          else
            range=HEAD
          fi
          ./gitleaks git --config .gitleaks.toml --log-opts="$range" --redact --no-banner --exit-code 1 .
