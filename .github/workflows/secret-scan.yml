name: Secret scan

# gitleaks over the commits of a pull request, and of a push to main. The rules are
# .gitleaks.toml: gitleaks' own, with the test keys under mobile/test/fixtures (made for the
# tests, and never regenerated) set aside. GitHub's secret scanning and push protection, which
# tool/github/apply_settings.sh turns on, work alongside this.
#
# gitleaks-action is free for repositories of a personal account. For one owned by an
# organization it needs a GITLEAKS_LICENSE secret; this job then fails until it is set, or until
# the action is replaced by the gitleaks binary.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  gitleaks:
    name: Secret scan
    # In the merge queue (merge_group) the job is skipped, which a required check counts as passing: the
    # commits were scanned on the pull request, and gitleaks-action doesn't run on that event.
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read # the commits of a pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2 # TODO: pin to SHA
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
